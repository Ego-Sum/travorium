<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Travorium — Premium Travel Web Deck v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#07182d;--ink-soft:#35455d;--muted:#6b7b8f;--blue:#1479d4;--blue-deep:#0b4e91;--cyan:#22c4d8;--sky:#e7f8ff;--white:#fff;--line:rgba(7,24,45,.10);--glass:rgba(255,255,255,.78);--glass-strong:rgba(255,255,255,.9);--shadow:0 28px 80px rgba(7,24,45,.16);--radius-frame:30px;--radius-card:26px;--ease:cubic-bezier(.19,1,.22,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 16% 8%,rgba(34,196,216,.20),transparent 32%),radial-gradient(circle at 88% 80%,rgba(20,121,212,.15),transparent 34%),linear-gradient(135deg,#f8fdff 0%,#e4f4f8 45%,#edf5f7 100%);display:flex;align-items:center;justify-content:center}
.ambient-orb{position:fixed;border-radius:999px;filter:blur(44px);opacity:.32;pointer-events:none;animation:floatOrb 13s ease-in-out infinite alternate}
.ambient-orb.one{width:260px;height:260px;left:-72px;top:18%;background:#68d4e8}
.ambient-orb.two{width:330px;height:330px;right:-110px;bottom:7%;background:#bfefff;animation-delay:-4s}
@keyframes floatOrb{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(28px,-20px,0) scale(1.07)}}
.deck-shell{position:relative;width:94vw;max-width:1640px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vh,18px)}
.presentation-frame{position:relative;width:100%;height:min(82vh,calc(100vh - 96px));min-height:0;overflow:hidden;border-radius:var(--radius-frame);background:#0d1b2a;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.60);isolation:isolate}
.track,.slide{position:absolute;inset:0}
.slide{opacity:0;visibility:hidden;transform:translateY(12px) scale(.997);transition:opacity .7s ease,transform .85s var(--ease),visibility .7s ease;display:flex;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:translateY(0) scale(1);z-index:2}
.slide-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 10s ease-out}
.slide.active .slide-bg{transform:scale(1)}
.slide-bg-overlay{position:absolute;inset:0;z-index:1}
.slide-bg-overlay.cover{background:rgba(0,0,0,0.20)}
.slide-bg-overlay.left-dark {
    position: absolute;
    top: 0;
    left: 0;
    width: 66%;
    height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.63) 0%, rgba(0,0,0,0.42) 70%, transparent 100%) !important;
    z-index: 2;
}
.slide-bg-overlay.bottom-dark {
    position: absolute !important;
    top: auto !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    height: 60% !important;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 70%, transparent 100%) !important;
    z-index: 5 !important;
    pointer-events: none;
}
.slide-bg-overlay.bottom-dark-70 {
    position: absolute !important;
    top: auto !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    height: 70% !important;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 70%, transparent 100%) !important;
    z-index: 5 !important;
    pointer-events: none;
}
.slide-bg-overlay.full-dark {
    position: absolute !important;
    inset: 0 !important;
    height: 100% !important;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.4) 100%) !important;
    z-index: 5 !important;
    pointer-events: none;
}
.slide-bg-overlay.darken-20 {
    background: rgba(0,0,0,0.2) !important;
}
.slide-bg-overlay.darken-10 {
    background: rgba(0,0,0,0.1) !important;
}
.slide-bg-overlay.darken-30 {
    background: rgba(0,0,0,0.3) !important;
}
.slide-bg-overlay.darken-25 {
    background: rgba(0,0,0,0.25) !important;
}
.slide-bg-overlay.darken-40 {
    background: rgba(0,0,0,0.4) !important;
}
.slide-bg-overlay.darken-50 {
    background: rgba(0,0,0,0.6) !important;
    backdrop-filter: blur(2px);
}
.slide-bg-overlay.darken-35 {
    background: rgba(0,0,0,0.35) !important;
}
.slide-bg-overlay.industry-dark {
    position: absolute !important;
    inset: 0 !important;
    background: rgba(0,0,0,0.5) !important;
    z-index: 5 !important;
    pointer-events: none;
}
.slide-bg-overlay.light{background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.88) 48%,rgba(255,255,255,.62) 100%),radial-gradient(circle at 84% 20%,rgba(34,196,216,.16),transparent 32%)}
.slide-grid{position:absolute;inset:0;z-index:2;opacity:.08;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.42) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 70%)}
.brand-logo{display:none !important;}
.slide-inner{position:relative;z-index:10;width:100%;height:100%;padding:clamp(38px,5.2vh,64px) clamp(46px,5.5vw,82px) clamp(36px,5vh,60px)}
.eyebrow{font-family:"Montserrat",sans-serif;font-size:clamp(9px,.8vw,11px);line-height:1;letter-spacing:.32em;text-transform:uppercase;color:var(--blue);font-weight:900;margin-bottom:clamp(12px,1.9vh,18px)}
.title{font-family:"Montserrat",sans-serif;font-weight:900;letter-spacing:-.055em;color:var(--ink);line-height:1.04}
.accent{color:var(--blue)}
/* Nav outside frame */
.nav-controls{height:clamp(40px,5.5vh,48px);display:flex;align-items:center;justify-content:center;gap:clamp(20px,3vw,34px);user-select:none;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.54);border:1px solid rgba(7,24,45,.10);backdrop-filter:blur(12px)}
.nav-btn{width:clamp(34px,4.2vh,42px);height:clamp(34px,4.2vh,42px);border-radius:999px;border:1px solid rgba(7,24,45,.13);background:rgba(255,255,255,.54);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s ease}
.nav-btn:hover:not(:disabled){transform:translateY(-1px);background:var(--ink);color:white;border-color:var(--ink);box-shadow:0 12px 24px rgba(7,24,45,.16)}
.nav-btn:disabled{opacity:.28;cursor:default}
.nav-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.slide-counter{font-family:"Montserrat",sans-serif;font-size:12px;letter-spacing:.22em;color:rgba(7,24,45,.72);font-weight:900;min-width:78px;text-align:center}
.lang-switcher{display:flex;gap:8px;margin-left:clamp(12px, 2vw, 24px);padding-left:clamp(12px, 2vw, 24px);border-left:1px solid rgba(7,24,45,0.15)}
.lang-btn{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.54);border:1px solid rgba(7,24,45,.12);backdrop-filter:blur(14px);color:var(--ink);font-family:"Montserrat",sans-serif;font-size:11px;font-weight:900;cursor:pointer;transition:.2s var(--ease);text-transform:uppercase;letter-spacing:.12em;box-shadow:0 6px 16px rgba(0,0,0,.04)}
.lang-btn:hover{background:rgba(255,255,255,.85);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.06);border-color:var(--blue)}
.lang-btn.active{background:var(--ink);color:white;border-color:var(--ink);box-shadow:0 8px 24px rgba(7,24,45,.18)}
/* Cover */
.cover .slide-inner{display:grid;place-items:center;text-align:center;padding-top:clamp(50px,7vh,82px)}
.cover-panel{width:min(1080px,90%);transform:translateY(6px);position:relative;}
.cover-title{font-family:"Montserrat",sans-serif;font-size:clamp(58px,8.6vw,130px);line-height:.88;font-weight:900;letter-spacing:.035em;text-transform:uppercase;color:#fff;text-shadow:0 22px 46px rgba(0,0,0,.38),0 3px 12px rgba(0,0,0,.48);margin-bottom:clamp(18px,3vh,28px)}
.cover-subtitle{margin:0 auto;max-width:880px;color:rgba(255,255,255,.96);font-size:clamp(18px,2vw,31px);font-weight:800;line-height:1.24;text-shadow:0 12px 28px rgba(0,0,0,.50)}
.cover-badge{margin-top:clamp(18px,3.2vh,30px);display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:999px;background:rgba(7,24,45,0.52);color:#fff;border:1px solid rgba(255,255,255,0.30);backdrop-filter:blur(18px);font-size:clamp(10px,.85vw,12px);font-weight:900;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 18px 42px rgba(0,0,0,0.24)}
.cover-badge.plain{background:none !important; border:none !important; box-shadow:none !important; padding:0 !important; backdrop-filter:none !important;}
/* Company */
.company .slide-inner{display:flex;align-items:center;justify-content:center}
.company-card{width:min(1240px,100%);height:100%;max-height:575px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,340px);gap:clamp(24px,3.4vw,42px);align-items:center;padding:clamp(24px,3.4vh,34px) clamp(28px,3.5vw,44px);border-radius:28px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.78);backdrop-filter:blur(28px);box-shadow:0 22px 60px rgba(7,24,45,.10)}
.company h1{font-size:clamp(30px,3.4vw,50px);max-width:760px;margin-bottom:clamp(16px,2.4vh,24px)}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,16px);margin-bottom:clamp(14px,2.2vh,20px)}
.metric{padding:clamp(14px,2vh,18px) clamp(16px,1.8vw,20px);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(232,248,253,.76));border:1px solid rgba(7,24,45,.08)}
.metric-value{font-family:"Montserrat",sans-serif;font-size:clamp(28px,3vw,40px);font-weight:900;color:var(--blue);letter-spacing:-.045em;line-height:.9;margin-bottom:10px}
.metric-label{color:var(--ink-soft);font-size:clamp(10px,.9vw,12px);font-weight:800;line-height:1.35}
.office-table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--line)}
.office-table td{padding:clamp(9px,1.5vh,12px) clamp(12px,1.6vw,16px);border-bottom:1px solid var(--line);color:var(--ink-soft);font-size:clamp(11px,.9vw,13px);font-weight:650}
.office-table tr:last-child td{border-bottom:0}
.office-table td:first-child{width:150px;color:var(--blue);font-weight:900}
.company-desc{margin-top:clamp(10px,1.8vh,14px);color:var(--ink-soft);font-size:clamp(11px,1vw,13.5px);line-height:1.48;font-weight:700}
.founder-card{position:relative;height:100%;max-height:500px;min-height:0;border-radius:26px;overflow:hidden;background:#d7e7ee;box-shadow:0 24px 52px rgba(7,24,45,.18);border:7px solid rgba(255,255,255,.86)}
.founder-card img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.founder-card::after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(to top,rgba(5,14,28,.92),transparent)}
.founder-caption{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}
.founder-caption strong{display:block;font-family:"Montserrat",sans-serif;font-size:clamp(20px,1.9vw,25px);line-height:1;margin-bottom:8px;font-weight:900;letter-spacing:-.03em}
.founder-caption span{color:#8be8f4;font-size:clamp(9px,.75vw,11px);font-weight:900;text-transform:uppercase;letter-spacing:.11em}
/* Benefits */
.benefits .slide-inner{display:flex;align-items:center;justify-content:center}
.benefits-layout{width:min(1240px,100%);height:100%;max-height:560px;display:grid;grid-template-columns:minmax(300px,405px) minmax(0,1fr);gap:clamp(18px,2.2vw,26px);align-items:stretch}
.benefits-hero{border-radius:28px;overflow:hidden;position:relative;background-image:url('data/img_2319560637765265143.jpg');background-size:cover;background-position:center;box-shadow:0 24px 60px rgba(7,24,45,.14);border:1px solid rgba(255,255,255,.62);min-height:0}
.benefits-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,18,34,.88),rgba(6,18,34,.18) 55%,rgba(255,255,255,.12)),radial-gradient(circle at 20% 18%,rgba(255,255,255,.28),transparent 28%)}
.benefits-hero-content{position:absolute;z-index:2;left:clamp(22px,2.2vw,30px);right:clamp(22px,2.2vw,30px);bottom:clamp(22px,2.2vw,30px);color:#fff}
.benefits-hero-content .eyebrow{color:#9ff3ff;margin-bottom:12px}
.benefits-hero-content h1{font-family:"Montserrat",sans-serif;font-size:clamp(34px,3.3vw,50px);line-height:.98;letter-spacing:-.055em;color:white;margin-bottom:16px;font-weight:900}
.benefits-hero-content p{color:rgba(255,255,255,.88);line-height:1.50;font-weight:700;font-size:clamp(12px,1vw,14px)}
.benefit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,16px);align-content:stretch}
.benefit-card{position:relative;overflow:hidden;border-radius:24px;padding:clamp(16px,2vh,20px);background:radial-gradient(circle at 100% 0%,rgba(34,196,216,.18),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.94),rgba(241,249,252,.84));border:1px solid rgba(255,255,255,.82);box-shadow:0 16px 38px rgba(7,24,45,.08);display:flex;flex-direction:column;justify-content:space-between;min-height:0;transition:transform .24s ease,box-shadow .24s ease}
.benefit-card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:999px;background:linear-gradient(to bottom,var(--blue),var(--cyan));opacity:.85}
.benefit-card:hover{transform:translateY(-4px);box-shadow:0 22px 48px rgba(7,24,45,.13)}
.benefit-top{display:flex;align-items:center;gap:12px;margin-bottom:clamp(10px,1.6vh,16px)}
.benefit-index{width:38px;height:38px;border-radius:15px;display:grid;place-items:center;background:rgba(20,121,212,.10);color:var(--blue);font-family:"Montserrat",sans-serif;font-size:12px;font-weight:900;letter-spacing:.06em}
.benefit-label{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;font-weight:900}
.benefit-card p{color:var(--ink);font-weight:800;line-height:1.38;font-size:clamp(12px,1vw,14.5px)}
/* Spaced Centered Services Grid */
.nsvc-slide .slide-inner { display: grid; place-items: start center; padding-top: clamp(25px, 5vh, 60px); padding-bottom: 20px; }
.nsvc-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }
.nsvc-title { font-family: "Montserrat", sans-serif; font-size: clamp(30px, 3.5vw, 46px); line-height: .98; letter-spacing: -.04em; color: white; margin-bottom: 35px; font-weight: 900; text-align: center; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 0 10px 20px rgba(0,0,0,0.5); text-transform: none !important; }
.nsvc-panel { width: 100%; display: flex; justify-content: center; background: transparent !important; border: none !important; padding: 0; margin-top: -5px; }
.nsvc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 90px; width: fit-content; margin: 0 auto; justify-items: center; align-items: center; }
.nsvc-card { display: flex; flex-direction: column; align-items: center; gap: 14px; transition: transform 0.4s var(--ease); }
.nsvc-card:hover { transform: translateY(-8px) scale(1.04); }
.nsvc-circle { width: 170px; height: 170px; border-radius: 50%; border: 3.5px solid #EFC96A; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); position: relative; }
.nsvc-circle img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
.nsvc-card:hover .nsvc-circle img { transform: scale(1.1); }
.nsvc-label { width: 200px; height: 38px; background: rgba(7, 24, 45, 0.95); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1.8px solid #EFC96A; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
.nsvc-label span { color: #fff; font-family: "Montserrat", sans-serif; font-size: 17px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; }
/* Pricing */
.pricing .slide-inner{display:flex;align-items:center;justify-content:center}
.pricing-wrap{width:min(1240px,100%);text-align:center}
.pricing-wrap h1{font-size:clamp(28px,3vw,46px);margin-bottom:clamp(4px,1vh,8px)}
.pricing-wrap .sub{color:var(--ink-soft);font-size:clamp(11px,1vw,14px);font-weight:700;margin-bottom:clamp(16px,2.6vh,28px)}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.6vw,22px);align-items:stretch}
.price-card{border-radius:24px;padding:clamp(20px,2.8vh,30px) clamp(18px,1.8vw,26px);background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(241,249,252,.84));border:1px solid rgba(7,24,45,.08);box-shadow:0 16px 38px rgba(7,24,45,.06);display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px);transition:transform .24s ease,box-shadow .24s ease;text-align:left}
.price-card:hover{transform:translateY(-4px);box-shadow:0 22px 48px rgba(7,24,45,.12)}
.price-card.featured{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;border-color:transparent;box-shadow:0 20px 50px rgba(20,121,212,.28)}
.price-card.featured .price-name,.price-card.featured .price-value,.price-card.featured .price-freq,.price-card.featured .price-feat{color:#fff}
.price-card.featured .price-feat::before{background:rgba(255,255,255,.3)}
.price-name{font-family:"Montserrat",sans-serif;font-size:clamp(11px,.9vw,13px);font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.price-value{font-family:"Montserrat",sans-serif;font-size:clamp(32px,3.4vw,48px);font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1}
.price-freq{font-size:clamp(10px,.8vw,12px);font-weight:700;color:var(--muted);margin-top:-6px}
.price-monthly{font-size:clamp(10px,.8vw,12px);font-weight:800;color:var(--ink-soft);padding:6px 0;border-top:1px dashed var(--line)}
.price-feats{list-style:none;display:flex;flex-direction:column;gap:clamp(6px,1vh,10px);margin-top:auto}
.price-feat{font-size:clamp(11px,.9vw,13px);font-weight:700;color:var(--ink-soft);padding-left:16px;position:relative;line-height:1.35}
.price-feat::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:99px;background:var(--cyan)}
.price-points{margin-top:auto;padding-top:clamp(8px,1.2vh,14px);border-top:1px solid var(--line);font-family:"Montserrat",sans-serif;font-size:clamp(10px,.85vw,12px);font-weight:900;color:var(--blue)}
.price-card.featured .price-points{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.9)}
/* Partnership */
.partnership .slide-inner{display:flex;align-items:center;justify-content:center}
.partner-layout{width:min(1280px,100%); display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,380px); gap:clamp(20px,2.5vw,35px); align-items:center}
.partner-info h1{font-size:clamp(28px,3.2vw,44px); margin-bottom:12px; line-height:1.1}
.partner-info .partner-desc{color:var(--ink-soft); font-size:clamp(12px,1.1vw,15px); font-weight:700; line-height:1.45; margin-bottom:18px}
.partner-feats{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.partner-feat{display:flex; align-items:center; gap:10px; padding:clamp(10px,1.4vh,15px) clamp(12px,1.2vw,16px); border-radius:18px; background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(241,249,252,.84)); border:1px solid rgba(7,24,45,.06); box-shadow:0 10px 24px rgba(7,24,45,.04); transition:transform .24s ease}
.partner-feat:hover{transform:translateY(-3px)}
.partner-feat-icon{width:42px; height:42px; border-radius:12px; background:rgba(20,121,212,.08); color:var(--blue); display:grid; place-items:center; font-size:20px; flex-shrink:0}
.partner-feat span{font-size:clamp(12px, 1.1vw, 16px); font-weight:800; color:var(--ink)}

                    <div class="comp-feature-text"><strong>${f.title}</strong><span>${f.desc}</span></div>
                </div>
            `).join("")}
        </div>
    ` : "";
    const layoutStyle = showFeatures ? "grid-template-columns: 1.2fr 1fr 1.2fr;" : "grid-template-columns: 1.2fr 3fr;";
    return `<div class="slide-bg" style="background-image:url('${d.bg}')"></div><div class="slide-bg-overlay cover darken-30"></div><div class="comp-grad-overlay"></div><div class="slide-grid"></div>${L}
    <div class="slide-inner ${d.customClass||''}" style="padding: 20px 60px; height: 100%; box-sizing: border-box; display: flex; align-items: stretch; justify-content: center;">
        <div class="comp-slide-layout" style="${layoutStyle} align-items: stretch; height: 100%; width: 100%; overflow: hidden;">
            <div class="comp-sidebar" style="justify-content: center; display: flex; flex-direction: column; height: 100%;">
                ${d.eyebrow !== "" ? `<div class="eyebrow">${d.eyebrow}</div>` : ""}
                <h1 class="title">${d.title}</h1>
                <div class="gold-divider" style="margin: 10px 0 20px 0; width: 100%;"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>
                <p>${d.body}</p>
            </div>
            ${midColumn}
            <div class="comp-visuals" style="justify-content: ${showFeatures ? 'flex-end' : 'space-around'}; flex: 1; display: flex; gap: 20px; align-items: stretch; height: 100%; min-height: 0;">
                ${cardsHtml}
            </div>
        </div>
    </div>`;
}
function renderIndustry(d){
    let menuHtml = d.menu.map(m => `<div style="text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 2px 2px 4px rgba(0,0,0,0.5);">${m}</div>`).join("");
    let bulletsHtml = d.bullets.map(b => `
        <div style="display:flex; gap:15px; align-items:flex-start; margin-bottom:20px;">
            <div style="width:12px; height:12px; background:#EFC96A; flex-shrink:0; margin-top:8px; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>
            <div style="color:white; font-size:22px; font-weight:800; line-height:1.3; text-shadow: 1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 2px 2px 4px rgba(0,0,0,0.8);">${b}</div>
        </div>
    `).join("");
    return `<div class="slide-bg" style="background-image:url('${d.bg}')"></div><div class="slide-bg-overlay industry-dark"></div><div class="slide-grid"></div>${L}
    <div class="slide-inner" style="padding: 40px 80px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="position:absolute; top:60px; left:80px; width:450px;">
            <div style="color:white; font-style:italic; font-size:20px; font-weight:600; line-height:1.4; text-shadow: 1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 0 4px 10px rgba(0,0,0,0.8);">${d.quote}</div>
            <div style="color:#EFC96A; font-weight:900; font-size:22px; margin-top:10px; text-shadow: 1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 0 4px 10px rgba(0,0,0,0.8);">${d.author}</div>
        </div>
        <div style="position:absolute; top:60px; right:80px; display:flex; gap:15px; align-items:stretch;">
            <div style="text-align:right; color:white; font-weight:900; font-size:24px; letter-spacing:2px; line-height:1.2;">${menuHtml}</div>
            <div style="width:4px; background:#EFC96A; box-shadow:0 0 10px rgba(239,201,106,0.5);"></div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:60px; width:100%; max-width:1200px; align-items:center; transform: translateY(40px);">
            <div style="border: 2.5px solid #EFC96A; border-radius:30px; overflow:hidden; aspect-ratio:1/1; box-shadow:0 30px 60px rgba(0,0,0,0.6); position:relative; width:380px; height:380px; justify-self: end;">
                <img src="${d.visual}" style="width:100%; height:100%; object-fit:cover;">
                <div style="position:absolute; inset:0; box-shadow:inset 0 0 40px rgba(239,201,106,0.3);"></div>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:center; margin:0; padding:0;">
                <h1 style="color:#5bc0eb; font-size:66px; font-weight:900; margin:0 0 10px 0; padding:0; line-height:1; letter-spacing:2px; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 10px 20px rgba(0,0,0,0.8);">${d.title}</h1>
                <div class="gold-divider" style="margin: 0 0 40px 0; width: 350px;"><div class="line"></div><div class="diamond"></div><div class="line"></div></div>
                ${bulletsHtml}
            </div>
        </div>
    </div>`;
}
function renderBusinessModel(d){
    let rows = d.comparison.map(r => `
        <div class="bm-row" style="background:${r.active?'rgba(0,0,0,0.7)':'rgba(255,255,255,0.95)'}; border:${r.active?'2px solid #EFC96A':'1px solid rgba(0,0,0,0.1)'}; border-radius:100px; padding:10px 40px; display:grid; grid-template-columns: 1.5fr auto 1.5fr auto 1fr; align-items:center; gap:20px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.4); margin-bottom:15px;">
            <div style="color:${r.active?'#5bc0eb':'#222'}; font-weight:900; font-size:22px; text-transform:uppercase; text-shadow:${r.active?'1px 1px 0 #000':'none'};">${r.left}</div>
            <div style="color:${r.active?'#5bc0eb':'#444'}; font-size:24px; font-weight:900;">→</div>
            <div style="color:${r.active?'white':'#444'}; font-weight:800; font-size:22px; text-align:center; text-shadow:${r.active?'1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000':'none'};">${r.center}</div>
            <div style="color:${r.active?'#5bc0eb':'#444'}; font-size:24px; font-weight:900;">→</div>
            <div style="color:${r.active?'white':'#222'}; font-weight:800; font-size:22px; text-align:right; text-shadow:${r.active?'1px 1px 0 #000':'none'};">${r.right}</div>
        </div>
    `).join("");
    let cards = d.features.map(f => `
        <div class="bm-card">
            <div style="width:50px; height:50px; border-radius:50%; background:white; border:2px solid #1479d4; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; box-shadow:0 5px 10px rgba(20,121,212,0.1);">${f.icon}</div>
            <div>
                <div style="font-family:'Montserrat',sans-serif; font-weight:900; font-size:16px; color:#07182d; margin-bottom:6px; letter-spacing:0.05em; text-transform:uppercase;">${f.title}</div>
                <div style="font-size:18px; font-weight:700; color:#35455d; line-height:1.4;">${f.desc}</div>
            </div>
        </div>
    `).join("");
    return `<div class="slide-bg" style="background-image:url('${d.bg}')"></div><div class="slide-bg-overlay darken-50"></div><div class="slide-grid"></div>${L}
    <div class="slide-inner" style="display:flex; flex-direction:column; justify-content:center; align-items:center; padding: 40px 80px;">
        <div style="width:100%; max-width:1150px; text-align:left; margin-bottom:30px;">
            <div class="eyebrow">${d.eyebrow}</div>
            <h1 style="color:white; font-size:56px; font-weight:900; margin:0; line-height:1; letter-spacing:2px; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 10px 30px rgba(0,0,0,0.8);">${d.title}</h1>
        </div>
        <div style="width:100%; max-width:1150px; margin-bottom:25px;">
            ${rows}
        </div>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; width:100%; max-width:1150px;">
            ${cards}
        </div>
    </div>`;
}
const renderers={
    cover:renderCover,
    company:renderCompany,
    benefits:renderBenefits,
    services:renderServices,
    pricing:renderPricing,
    partnership:renderPartnership,
    generic:renderGeneric,
    dest:renderDest,
    comptable:renderCompTable,
    cta:renderCta,
    referral:renderReferral,
    dreamcation:renderDreamcation,
    travelsite:renderTravelSite,
    comparison:renderComparison,
    industry:renderIndustry,
    businessmodel:renderBusinessModel,
    blank: (d) => `<div class="slide-bg" style="background:${d.bg}"></div>`
};
let cur = 0;
const total = 25;
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");

function go() {
    const currentSlides = document.querySelectorAll(".slide");
    currentSlides.forEach((s, i) => { s.classList.toggle("active", i === cur) });
    if (counter) counter.textContent = (cur + 1).toString().padStart(2, "0") + " / " + total.toString().padStart(2, "0");
    if (prevBtn) prevBtn.disabled = cur === 0;
    if (nextBtn) nextBtn.disabled = cur === currentSlides.length - 1;
}

if (prevBtn) prevBtn.onclick = () => { if (cur > 0) { cur--; go() } };
if (nextBtn) nextBtn.onclick = () => { if (cur < total - 1) { cur++; go() } };
document.onkeydown = e => {
    if (e.key === "ArrowLeft" && cur > 0) { cur--; go() }
    else if (e.key === "ArrowRight" && cur < total - 1) { cur++; go() }
};

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.onclick = () => {
        const lang = btn.getAttribute('data-lang');
        if (lang === curLang) return;
        
        curLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.documentElement.lang = lang;
        
        renderAll();
    };
});

function renderAll() {
    const data = curLang === 'ru' ? SLIDES_RU : (curLang === 'en' ? SLIDES_EN : SLIDES_ES);
    track.innerHTML = '';
    data.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "slide " + (s.type || "") + (i === cur ? " active" : "");
        el.innerHTML = (renderers[s.type] || renderers.cover)(s);
        track.appendChild(el);
    });
    go();
}

// Initial render
renderAll();
</script>
</body>
</html>
